<div class="container-fluid">
  <div class="row mb-4">
    <div class="d-flex justify-content-between mb-4" style="gap: 0.5rem;">
      <div class="card text-white bg-primary flex-fill">
        <div class="card-body text-center">
          <h6 class="card-title small">Total Sales Revenue</h6>
          <p class="card-text fs-4 mb-0">$2,450,000</p>
        </div>
      </div>
      <div class="card text-white bg-success flex-fill">
        <div class="card-body text-center">
          <h6 class="card-title small">Gross Profit</h6>
          <p class="card-text fs-4 mb-0">$975,000</p>
        </div>
      </div>
      <div class="card text-white bg-info flex-fill">
        <div class="card-body text-center">
          <h6 class="card-title small">EBIT Impact</h6>
          <p class="card-text fs-4 mb-0">$28,500,000</p>
        </div>
      </div>
      <div class="card text-white bg-warning flex-fill">
        <div class="card-body text-center">
          <h6 class="card-title small">Avg Margin %</h6>
          <p class="card-text fs-4 mb-0">39.8%</p>
        </div>
      </div>
      <div class="card text-white bg-secondary flex-fill">
        <div class="card-body text-center">
          <h6 class="card-title small">Data Validation</h6>
          <p class="card-text fs-4 mb-0">92%</p>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Sales and GP Trend (2025)</h5>
            <canvas id="salesGpTrendChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Volume Forecast (Next 6 Months)</h5>
            <canvas id="volumeForecastChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
